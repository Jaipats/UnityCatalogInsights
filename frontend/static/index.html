<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UnityCatalogInsights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #0f1117; --bg-secondary: #1a1d27; --bg-tertiary: #242836;
      --bg-hover: #2d3245; --text-primary: #e8eaed; --text-secondary: #9aa0a6;
      --text-muted: #6b7280; --accent: #4f8ff7; --accent-hover: #3b7de6;
      --accent-subtle: rgba(79,143,247,0.12); --border: #2d3245;
      --user-bg: #1e3a5f; --success: #34d399; --radius: 12px; --radius-sm: 8px;
    }
    html, body { height: 100%; font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-primary); color: var(--text-primary); -webkit-font-smoothing: antialiased; }
    #root { height: 100%; }
    .app-container { display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 300px; min-width: 300px; background: var(--bg-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.25s ease; }
    .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 20px; border-bottom: 1px solid var(--border); }
    .sidebar-header h3 { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); }
    .sidebar-close { display: none; background: none; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer; }
    .sidebar-tables { flex: 1; overflow-y: auto; padding: 12px; }
    .sidebar-table-card { padding: 12px; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.15s; margin-bottom: 4px; }
    .sidebar-table-card:hover { background: var(--bg-hover); }
    .sidebar-table-name { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
    .sidebar-table-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Main Chat */
    .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-header { display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--bg-secondary); }
    .sidebar-toggle { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 6px; border-radius: 6px; display: none; }
    .sidebar-toggle:hover { background: var(--bg-hover); }
    .header-content h1 { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--success)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-content p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .user-badge { display: flex; align-items: center; gap: 8px; margin-left: auto; padding: 6px 12px; background: var(--bg-tertiary); border-radius: 20px; border: 1px solid var(--border); }
    .user-badge-avatar { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, #4f8ff7, #34d399); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
    .user-badge-name { font-size: 12px; color: var(--text-secondary); font-weight: 500; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Messages */
    .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
    .message { display: flex; gap: 12px; max-width: 840px; width: 100%; margin: 0 auto; }
    .message-avatar { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .user-avatar { background: var(--user-bg); color: var(--accent); }
    .assistant-avatar { background: linear-gradient(135deg, #4f8ff7, #34d399); color: #fff; }
    .user-message .message-content { background: var(--bg-tertiary); padding: 12px 16px; border-radius: var(--radius); font-size: 14px; line-height: 1.6; }
    .assistant-message .message-body { flex: 1; min-width: 0; }
    .assistant-message .message-content { font-size: 14px; line-height: 1.7; }
    .assistant-message .message-content p { margin-bottom: 8px; }
    .assistant-message .message-content p:last-child { margin-bottom: 0; }
    .assistant-message .message-content code { background: var(--bg-tertiary); padding: 2px 6px; border-radius: 4px; font-size: 13px; color: var(--accent); }
    .assistant-message .message-content pre { background: var(--bg-tertiary); padding: 12px 16px; border-radius: var(--radius-sm); overflow-x: auto; margin: 8px 0; }
    .assistant-message .message-content pre code { background: none; padding: 0; }
    .assistant-message .message-content h1, .assistant-message .message-content h2, .assistant-message .message-content h3 { margin: 16px 0 8px; font-weight: 600; }
    .assistant-message .message-content ul, .assistant-message .message-content ol { padding-left: 20px; margin: 8px 0; }
    .assistant-message .message-content li { margin-bottom: 4px; }
    .assistant-message .message-content strong { color: #fff; }
    .assistant-message .message-content table { border-collapse: collapse; margin: 12px 0; width: 100%; }
    .assistant-message .message-content th, .assistant-message .message-content td { border: 1px solid var(--border); padding: 8px 12px; font-size: 13px; text-align: left; }
    .assistant-message .message-content th { background: var(--bg-tertiary); font-weight: 600; }

    /* Sources */
    .sources-section { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
    .sources-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 8px; }
    .sources-grid { display: flex; gap: 8px; flex-wrap: wrap; }
    .source-card { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; flex: 1 1 220px; max-width: 300px; }
    .source-table { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 4px; word-break: break-all; }
    .source-desc { font-size: 11px; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .source-score { font-size: 10px; color: var(--success); margin-top: 6px; font-weight: 500; }

    /* Loading */
    .loading-dots { display: flex; gap: 6px; padding: 12px 0; }
    .loading-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); animation: bounce 1.4s ease-in-out infinite; }
    .loading-dots span:nth-child(2) { animation-delay: 0.16s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.32s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

    /* Welcome */
    .welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; max-width: 640px; margin: 0 auto; }
    .welcome-icon { color: var(--accent); margin-bottom: 16px; opacity: 0.7; }
    .welcome-screen h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .welcome-screen > p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 28px; }
    .suggested-questions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .suggested-btn { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 20px; padding: 8px 16px; color: var(--text-primary); font-size: 13px; cursor: pointer; transition: all 0.15s; }
    .suggested-btn:hover { background: var(--accent-subtle); border-color: var(--accent); color: var(--accent); }

    /* Input */
    .chat-input-form { display: flex; gap: 8px; padding: 16px 24px 24px; max-width: 840px; width: 100%; margin: 0 auto; }
    .chat-input-form input { flex: 1; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; color: var(--text-primary); font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.15s; }
    .chat-input-form input:focus { border-color: var(--accent); }
    .chat-input-form input::placeholder { color: var(--text-muted); }
    .chat-input-form button { background: var(--accent); border: none; border-radius: var(--radius); padding: 12px 16px; color: #fff; cursor: pointer; transition: background 0.15s; display: flex; align-items: center; justify-content: center; }
    .chat-input-form button:hover:not(:disabled) { background: var(--accent-hover); }
    .chat-input-form button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,0.5); }
      .sidebar-close { display: block; }
      .sidebar-toggle { display: block; }
      .chat-messages { padding: 16px; }
      .chat-input-form { padding: 12px 16px 16px; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/marked@12/marked.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const SUGGESTED_QUESTIONS = [
      "What tables contain customer credit information?",
      "How can I join customer data with credit scores?",
      "What is the disputes table used for?",
      "Which tables track identity verification?",
      "What columns are available for credit inquiries?",
    ];

    function renderMarkdown(text) {
      return { __html: marked.parse(text || "") };
    }

    function SourceCard({ source }) {
      return (
        <div className="source-card">
          <div className="source-table">{source.table_name}</div>
          <div className="source-desc">{source.nl_description}</div>
          <div className="source-score">
            Relevance: {(source.score * 100).toFixed(0)}%
          </div>
        </div>
      );
    }

    function Message({ msg }) {
      if (msg.role === "user") {
        return (
          <div className="message user-message">
            <div className="message-avatar user-avatar">You</div>
            <div className="message-content">{msg.content}</div>
          </div>
        );
      }
      return (
        <div className="message assistant-message">
          <div className="message-avatar assistant-avatar">UC</div>
          <div className="message-body">
            <div className="message-content" dangerouslySetInnerHTML={renderMarkdown(msg.content)} />
            {msg.sources && msg.sources.length > 0 && (
              <div className="sources-section">
                <div className="sources-label">Sources</div>
                <div className="sources-grid">
                  {msg.sources.map((s, i) => <SourceCard key={i} source={s} />)}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [sidebarTables, setSidebarTables] = useState([]);
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const chatEndRef = useRef(null);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages]);

      useEffect(() => {
        fetch("/api/me")
          .then(r => r.json())
          .then(data => setCurrentUser(data.user))
          .catch(() => {});
        fetch("/api/tables")
          .then(r => r.json())
          .then(data => setSidebarTables(data.tables || []))
          .catch(() => {});
      }, []);

      async function sendMessage(text) {
        if (!text.trim()) return;
        const userMsg = { role: "user", content: text };
        setMessages(prev => [...prev, userMsg]);
        setInput("");
        setLoading(true);
        try {
          const resp = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, num_results: 5 }),
          });
          if (resp.status === 403) {
            setMessages(prev => [...prev, {
              role: "assistant",
              content: "You don't have permission to access this catalog data. Contact your admin to request access.",
              sources: [],
            }]);
            return;
          }
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          const data = await resp.json();
          setMessages(prev => [...prev, { role: "assistant", content: data.answer, sources: data.sources }]);
        } catch (err) {
          setMessages(prev => [...prev, {
            role: "assistant",
            content: "Something went wrong: " + err.message + ". Please try again.",
            sources: [],
          }]);
        } finally {
          setLoading(false);
        }
      }

      function handleSubmit(e) {
        e.preventDefault();
        sendMessage(input);
      }

      return (
        <div className="app-container">
          <aside className={"sidebar " + (sidebarOpen ? "open" : "")}>
            <div className="sidebar-header">
              <h3>Catalog Tables</h3>
              <button className="sidebar-close" onClick={() => setSidebarOpen(false)}>&#x2715;</button>
            </div>
            <div className="sidebar-tables">
              {sidebarTables.map((t, i) => (
                <div key={i} className="sidebar-table-card" onClick={() => { sendMessage("Tell me about the table " + t.table_name); setSidebarOpen(false); }}>
                  <div className="sidebar-table-name">{t.table_name.split(".").pop()}</div>
                  <div className="sidebar-table-desc">{t.nl_description || t.column_names}</div>
                </div>
              ))}
            </div>
          </aside>

          <main className="chat-main">
            <header className="chat-header">
              <button className="sidebar-toggle" onClick={() => setSidebarOpen(!sidebarOpen)}>
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                  <rect y="3" width="20" height="2" rx="1" />
                  <rect y="9" width="20" height="2" rx="1" />
                  <rect y="15" width="20" height="2" rx="1" />
                </svg>
              </button>
              <div className="header-content">
                <h1>UnityCatalogInsights</h1>
                <p>Ask questions about your Unity Catalog data in natural language</p>
              </div>
              {currentUser && (
                <div className="user-badge">
                  <div className="user-badge-avatar">
                    {(currentUser.name || currentUser.email || "?")[0].toUpperCase()}
                  </div>
                  <span className="user-badge-name">{currentUser.name || currentUser.email}</span>
                </div>
              )}
            </header>

            <div className="chat-messages">
              {messages.length === 0 && (
                <div className="welcome-screen">
                  <div className="welcome-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                      <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                  </div>
                  <h2>Explore Your Data Catalog</h2>
                  <p>
                    I can help you understand what data is available, what columns mean, how tables relate, and who has access.
                    {currentUser && (" Results are filtered to data you have access to, " + (currentUser.name || currentUser.email) + ".")}
                  </p>
                  <div className="suggested-questions">
                    {SUGGESTED_QUESTIONS.map((q, i) => (
                      <button key={i} className="suggested-btn" onClick={() => sendMessage(q)}>{q}</button>
                    ))}
                  </div>
                </div>
              )}
              {messages.map((msg, i) => <Message key={i} msg={msg} />)}
              {loading && (
                <div className="message assistant-message">
                  <div className="message-avatar assistant-avatar">UC</div>
                  <div className="message-content loading-dots">
                    <span></span><span></span><span></span>
                  </div>
                </div>
              )}
              <div ref={chatEndRef} />
            </div>

            <form className="chat-input-form" onSubmit={handleSubmit}>
              <input
                type="text"
                value={input}
                onChange={e => setInput(e.target.value)}
                placeholder="Ask about your data catalog..."
                disabled={loading}
                autoFocus
              />
              <button type="submit" disabled={loading || !input.trim()}>
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                </svg>
              </button>
            </form>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
